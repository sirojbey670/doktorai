<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoktorAI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f0;
  --white: #ffffff;
  --green: #1a7a3c;
  --green-light: #2da455;
  --green-pale: #e8f5ec;
  --green-border: #c3e6cb;
  --text: #1a2e1a;
  --muted: #6b7f6b;
  --red: #c0392b;
  --shadow: 0 4px 24px rgba(26,122,60,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* HEADER */
.header {
  background: var(--white);
  border-bottom: 1px solid var(--green-border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 12px rgba(26,122,60,0.08);
  flex-shrink: 0;
}

.logo {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--green), var(--green-light));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 12px rgba(26,122,60,0.3);
}

.header-info { flex: 1; }
.header-title {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text);
}
.header-status {
  font-size: 0.72rem;
  color: var(--green-light);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 1px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green-light);
  animation: pulse 2s infinite;
}

/* LANG SWITCHER */
.lang-switcher {
  display: flex;
  gap: 4px;
  background: var(--green-pale);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--green-border);
}

.lang-btn {
  padding: 5px 10px;
  border: none;
  border-radius: 7px;
  font-family: 'Sora', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--muted);
  transition: all 0.2s;
}

.lang-btn.active {
  background: var(--green);
  color: white;
  box-shadow: 0 2px 8px rgba(26,122,60,0.3);
}

/* MESSAGES */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--green-border); border-radius: 4px; }

.msg {
  display: flex;
  gap: 10px;
  animation: slideUp 0.3s ease;
}

.msg.user { flex-direction: row-reverse; }

.avatar {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.bot-avatar {
  background: linear-gradient(135deg, var(--green), var(--green-light));
  box-shadow: 0 2px 8px rgba(26,122,60,0.25);
}

.user-avatar {
  background: linear-gradient(135deg, #3498db, #2980b9);
  box-shadow: 0 2px 8px rgba(52,152,219,0.25);
}

.bubble {
  max-width: 76%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 0.88rem;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.bot-bubble {
  background: var(--white);
  border: 1px solid var(--green-border);
  border-radius: 4px 16px 16px 16px;
  color: var(--text);
  box-shadow: var(--shadow);
}

.user-bubble {
  background: linear-gradient(135deg, var(--green), var(--green-light));
  color: white;
  border-radius: 16px 4px 16px 16px;
  box-shadow: 0 4px 16px rgba(26,122,60,0.25);
}

.msg-time {
  font-size: 0.65rem;
  opacity: 0.5;
  margin-top: 5px;
  font-family: 'JetBrains Mono', monospace;
}

/* TYPING */
.typing-dots {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 4px 0;
}

.typing-dots span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green-light);
  animation: bounce 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

/* QUICK REPLIES */
.quick-wrap {
  padding: 8px 16px 0;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  flex-shrink: 0;
  padding-bottom: 4px;
}

.quick-wrap::-webkit-scrollbar { display: none; }

.quick-btn {
  padding: 7px 14px;
  background: var(--white);
  border: 1px solid var(--green-border);
  border-radius: 20px;
  font-family: 'Sora', sans-serif;
  font-size: 0.78rem;
  color: var(--green);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s;
  font-weight: 600;
}

.quick-btn:hover, .quick-btn:active {
  background: var(--green);
  color: white;
  border-color: var(--green);
  transform: translateY(-1px);
}

/* INPUT */
.input-area {
  padding: 12px 16px 16px;
  background: var(--white);
  border-top: 1px solid var(--green-border);
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

textarea {
  flex: 1;
  border: 1.5px solid var(--green-border);
  border-radius: 14px;
  padding: 11px 15px;
  font-family: 'Sora', sans-serif;
  font-size: 0.88rem;
  color: var(--text);
  background: var(--bg);
  resize: none;
  max-height: 100px;
  overflow-y: auto;
  transition: border-color 0.2s;
  line-height: 1.5;
}

textarea:focus {
  outline: none;
  border-color: var(--green);
  background: var(--white);
}

textarea::placeholder { color: var(--muted); }

.send-btn {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, var(--green), var(--green-light));
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(26,122,60,0.3);
}

.send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,122,60,0.4); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* DISCLAIMER */
.disclaimer {
  text-align: center;
  font-size: 0.68rem;
  color: var(--muted);
  padding: 6px 16px 10px;
  background: var(--white);
  flex-shrink: 0;
}

/* ERROR */
.error-bar {
  margin: 0 16px 8px;
  padding: 10px 14px;
  background: #fdf0ef;
  border: 1px solid #f5c6c2;
  border-radius: 10px;
  font-size: 0.8rem;
  color: var(--red);
  display: none;
}

/* API KEY INPUT */
.api-setup {
  background: var(--white);
  border: 1px solid var(--green-border);
  border-radius: 16px;
  padding: 16px;
  margin: 12px 16px;
  flex-shrink: 0;
}

.api-setup-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--green);
  margin-bottom: 8px;
}

.api-input-row {
  display: flex;
  gap: 8px;
}

.api-input {
  flex: 1;
  border: 1.5px solid var(--green-border);
  border-radius: 10px;
  padding: 9px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--text);
  background: var(--bg);
}

.api-input:focus { outline: none; border-color: var(--green); }

.api-save-btn {
  padding: 9px 16px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 10px;
  font-family: 'Sora', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
@keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>

    <button class="lang-btn" onclick="setLang('kz')">Қз</button>
  </div>
</div>

<!-- API SETUP -->
<div class="api-setup" id="apiSetup">
  <div class="api-setup-title">🔑 Anthropic API kalitini kiriting</div>
  <div class="api-input-row">
    <input type="password" class="api-input" id="apiKeyInput" placeholder="gsk_...">
    <button class="api-save-btn" onclick="saveApiKey()">Saqlash</button>
  </div>
</div>

<!-- MESSAGES -->
<div class="messages" id="messages"></div>

<!-- ERROR -->
<div class="error-bar" id="errorBar"></div>

<!-- QUICK REPLIES -->
<div class="quick-wrap" id="quickWrap"></div>

<!-- INPUT -->
<div class="input-area">
  <textarea id="inputText" rows="1" placeholder="Shikoyatingizni yozing..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<div class="disclaimer">⚕️ Bu AI maslahati — jiddiy holatda shifokorga murojaat qiling</div>

<script>
const SYSTEM_PROMPT = `Sen "DoktorAI" — Markaziy Osiyo uchun AI tibbiy assistent.

Qoidalar:
1. Foydalanuvchi QAYSI TILDA yozsa — O'SHA TILDA javob ber (o'zbek, qozoq, rus)
2. Simptomlarni tingla, qaysi mutaxassis kerakligini ayt
3. Har doim oxirida: "⚕️ Bu AI maslahati — shifokorga murojaat qiling"
4. Qisqa, aniq, do'stona gapir
5. Jiddiy simptomlarda darhol tez yordam chaqirishni ayt

Mutaxassislar: Terapevt, Kardiolog, Nevropatolog, Gastroenterolog, Lor, Oftalmolog, Ortoped, Dermatolog, Pediatr`;

const QUICK = {
  uz: ["🤒 Bosh og'riq","🫀 Ko'krak og'riq","🤢 Oshqozon","🦴 Bo'g'im","👁 Ko'z","🌡 Harorat","😷 Yo'tal"],
  ru: ["🤒 Головная боль","🫀 Боль в груди","🤢 Желудок","🦴 Суставы","👁 Глаза","🌡 Температура","😷 Кашель"],
  kz: ["🤒 Бас ауырады","🫀 Кеуде","🤢 Асқазан","🦴 Буын","👁 Көз","🌡 Температура","😷 Жөтел"]
};

const GREET = {
  uz: "Salom! Men DoktorAIman 🩺\n\nQanday shikoyatingiz bor? O'zbek, rus yoki qozoq tilida yozing.",
  ru: "Здравствуйте! Я AI Медицинский Советник 🩺\n\nОпишите ваши симптомы на любом языке.",
  kz: "Сәлем! Мен AI Медициналық Кеңесшімін 🩺\n\nБелгілеріңізді қазақша, өзбекше немесе орысша жазыңыз."
};

let lang = 'uz';
let history = [];
let apiKey = localStorage.getItem('groq_key') || '';
let loading = false;

function getTime() {
  return new Date().toLocaleTimeString('uz', {hour:'2-digit', minute:'2-digit'});
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach((b,i) => {
    b.classList.toggle('active', ['uz','ru','kz'][i] === l);
  });
  renderQuick();
  document.getElementById('inputText').placeholder =
    l === 'uz' ? 'Shikoyatingizni yozing...' :
    l === 'ru' ? 'Опишите симптомы...' : 'Белгілеріңізді жазыңыз...';
}

function renderQuick() {
  const wrap = document.getElementById('quickWrap');
  wrap.innerHTML = '';
  QUICK[lang].forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = q;
    btn.onclick = () => sendMessage(q);
    wrap.appendChild(btn);
  });
}

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'bot' ? 'bot-avatar' : 'user-avatar'}`;
  avatar.textContent = role === 'bot' ? '🩺' : '👤';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role === 'bot' ? 'bot-bubble' : 'user-bubble'}`;

  const textDiv = document.createElement('div');
  textDiv.textContent = text;

  const timeDiv = document.createElement('div');
  timeDiv.className = 'msg-time';
  timeDiv.textContent = getTime();

  bubble.appendChild(textDiv);
  bubble.appendChild(timeDiv);
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot-avatar';
  avatar.textContent = '🩺';

  const bubble = document.createElement('div');
  bubble.className = 'bubble bot-bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function showError(msg) {
  const bar = document.getElementById('errorBar');
  bar.textContent = msg;
  bar.style.display = 'block';
  setTimeout(() => bar.style.display = 'none', 4000);
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val.startsWith('gsk_')) {
    showError('Groq kaliti "gsk_" bilan boshlanishi kerak!');
    return;
  }
  apiKey = val;
  localStorage.setItem('groq_key', val);
  document.getElementById('apiSetup').style.display = 'none';
  addMessage('bot', GREET[lang]);
}

async function sendMessage(text) {
  if (loading) return;
  const input = document.getElementById('inputText');
  const msg = (text || input.value).trim();
  if (!msg) return;
  if (!apiKey) { showError('Avval API kalitni kiriting!'); return; }

  input.value = '';
  autoResize(input);
  addMessage('user', msg);

  history.push({ role: 'user', content: msg });
  loading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1000,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history]
      })
    });

    const data = await res.json();
    hideTyping();

    if (data.error) throw new Error(data.error.message);

    const reply = data.choices[0].message.content;
    history.push({ role: 'assistant', content: reply });
    if (history.length > 20) history = history.slice(-20);
    addMessage('bot', reply);

  } catch(e) {
    hideTyping();
    showError('Xatolik: ' + (e.message || 'Qayta urinib ko\'ring'));
    addMessage('bot', '⚠️ Vaqtinchalik muammo. Biroz kutib qayta yozing.');
  } finally {
    loading = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// INIT
if (apiKey) {
  document.getElementById('apiSetup').style.display = 'none';
  addMessage('bot', GREET[lang]);
} else {
  document.getElementById('apiKeyInput').value = '';
}
renderQuick();
</script>
</body>
</html>
