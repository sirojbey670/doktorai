<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoktorAI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f0;
  --white: #ffffff;
  --green: #1a7a3c;
  --green-light: #2da455;
  --green-pale: #e8f5ec;
  --green-border: #c3e6cb;
  --text: #1a2e1a;
  --muted: #6b7f6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.header {
  background: var(--white);
  border-bottom: 1px solid var(--green-border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 12px rgba(26,122,60,0.08);
  flex-shrink: 0;
}
.logo {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--green), var(--green-light));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.header-title { font-weight: 700; font-size: 0.95rem; }
.header-status { font-size: 0.72rem; color: var(--green-light); display: flex; align-items: center; gap: 5px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-light); animation: pulse 2s infinite; }
.lang-switcher { display: flex; gap: 4px; background: var(--green-pale); padding: 4px; border-radius: 10px; border: 1px solid var(--green-border); margin-left: auto; }
.lang-btn { padding: 5px 10px; border: none; border-radius: 7px; font-family: 'Sora', sans-serif; font-size: 0.72rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--muted); transition: all 0.2s; }
.lang-btn.active { background: var(--green); color: white; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; animation: slideUp 0.3s ease; }
.msg.user { flex-direction: row-reverse; }
.avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.bot-avatar { background: linear-gradient(135deg, var(--green), var(--green-light)); }
.user-avatar { background: linear-gradient(135deg, #3498db, #2980b9); }
.bubble { max-width: 76%; padding: 12px 16px; border-radius: 16px; font-size: 0.88rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
.bot-bubble { background: var(--white); border: 1px solid var(--green-border); border-radius: 4px 16px 16px 16px; color: var(--text); }
.user-bubble { background: linear-gradient(135deg, var(--green), var(--green-light)); color: white; border-radius: 16px 4px 16px 16px; }
.msg-time { font-size: 0.65rem; opacity: 0.5; margin-top: 5px; }
.typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--green-light); animation: bounce 1.2s ease-in-out infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
.quick-wrap { padding: 8px 16px 4px; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; }
.quick-wrap::-webkit-scrollbar { display: none; }
.quick-btn { padding: 7px 14px; background: var(--white); border: 1px solid var(--green-border); border-radius: 20px; font-family: 'Sora', sans-serif; font-size: 0.78rem; color: var(--green); cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; font-weight: 600; }
.quick-btn:hover { background: var(--green); color: white; }
.input-area { padding: 12px 16px 16px; background: var(--white); border-top: 1px solid var(--green-border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
textarea { flex: 1; border: 1.5px solid var(--green-border); border-radius: 14px; padding: 11px 15px; font-family: 'Sora', sans-serif; font-size: 0.88rem; color: var(--text); background: var(--bg); resize: none; max-height: 100px; transition: border-color 0.2s; line-height: 1.5; }
textarea:focus { outline: none; border-color: var(--green); background: var(--white); }
.send-btn { width: 44px; height: 44px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--green), var(--green-light)); color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.disclaimer { text-align: center; font-size: 0.68rem; color: var(--muted); padding: 6px 16px 10px; background: var(--white); flex-shrink: 0; }
.error-bar { margin: 0 16px 8px; padding: 10px 14px; background: #fdf0ef; border: 1px solid #f5c6c2; border-radius: 10px; font-size: 0.8rem; color: #c0392b; display: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
@keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="header">
  <div class="logo">🩺</div>
  <div>
    <div class="header-title">DoktorAI</div>
    <div class="header-status"><div class="status-dot"></div>Online · O'zbek · Русский · Қазақ</div>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('uz')">O'z</button>
    <button class="lang-btn" onclick="setLang('ru')">Ру</button>
    <button class="lang-btn" onclick="setLang('kz')">Қз</button>
  </div>
</div>
<div class="messages" id="messages"></div>
<div class="error-bar" id="errorBar"></div>
<div class="quick-wrap" id="quickWrap"></div>
<div class="input-area">
  <textarea id="inputText" rows="1" placeholder="Shikoyatingizni yozing..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>
<div class="disclaimer">⚕️ Bu AI maslahati — jiddiy holatda shifokorga murojaat qiling</div>

<script>
const QUICK = {
  uz: ["🤒 Bosh og'riq","🫀 Ko'krak og'riq","🤢 Oshqozon","🦴 Bo'g'im","👁 Ko'z","🌡 Harorat","😷 Yo'tal"],
  ru: ["🤒 Головная боль","🫀 Боль в груди","🤢 Желудок","🦴 Суставы","👁 Глаза","🌡 Температура","😷 Кашель"],
  kz: ["🤒 Бас ауырады","🫀 Кеуде","🤢 Асқазан","🦴 Буын","👁 Көз","🌡 Температура","😷 Жөтел"]
};
const GREET = {
  uz: "Salom! Men DoktorAI — AI tibbiy yo'riqchiman 🩺\n\nQanday shikoyatingiz bor? O'zbek, rus yoki qozoq tilida yozing.",
  ru: "Здравствуйте! Я DoktorAI — AI медицинский советник 🩺\n\nОпишите ваши симптомы.",
  kz: "Сәлем! Мен DoktorAI 🩺\n\nБелгілеріңізді жазыңыз."
};
let lang = 'uz';
let history = [];
let loading = false;

function getTime() { return new Date().toLocaleTimeString('uz', {hour:'2-digit', minute:'2-digit'}); }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach((b,i) => b.classList.toggle('active', ['uz','ru','kz'][i] === l));
  renderQuick();
  document.getElementById('inputText').placeholder = l==='uz'?'Shikoyatingizni yozing...':l==='ru'?'Опишите симптомы...':'Белгілеріңізді жазыңыз...';
}

function renderQuick() {
  const wrap = document.getElementById('quickWrap');
  wrap.innerHTML = '';
  QUICK[lang].forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.textContent = q;
    btn.onclick = () => sendMessage(q);
    wrap.appendChild(btn);
  });
}

function addMessage(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (role==='bot'?'bot-avatar':'user-avatar');
  avatar.textContent = role==='bot'?'🩺':'👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role==='bot'?'bot-bubble':'user-bubble');
  const textDiv = document.createElement('div');
  textDiv.textContent = text;
  const timeDiv = document.createElement('div');
  timeDiv.className = 'msg-time';
  timeDiv.textContent = getTime();
  bubble.appendChild(textDiv);
  bubble.appendChild(timeDiv);
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'avatar bot-avatar';
  avatar.textContent = '🩺';
  const bubble = document.createElement('div');
  bubble.className = 'bubble bot-bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function showError(msg) {
  const bar = document.getElementById('errorBar');
  bar.textContent = msg;
  bar.style.display = 'block';
  setTimeout(() => bar.style.display = 'none', 4000);
}

async function sendMessage(text) {
  if (loading) return;
  const input = document.getElementById('inputText');
  const msg = (text || input.value).trim();
  if (!msg) return;
  input.value = '';
  autoResize(input);
  addMessage('user', msg);
  history.push({role:'user', content:msg});
  loading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: history})
    });
    const data = await res.json();
    hideTyping();
    const reply = data.reply;
    history.push({role:'assistant', content:reply});
    if (history.length > 20) history = history.slice(-20);
    addMessage('bot', reply);
  } catch(e) {
    hideTyping();
    showError('Xatolik yuz berdi. Qayta urinib koring.');
    addMessage('bot', 'Vaqtinchalik muammo. Biroz kutib qayta yozing.');
  } finally {
    loading = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

addMessage('bot', GREET[lang]);
renderQuick();
</script>
</body>
</html>
